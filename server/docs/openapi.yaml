  /api/admin/device/{deviceId}/geo:
    post:
      tags:
        - admin
      summary: 写入管理员提供的粗略位置
      description: |
        服务端**刻意不做自动地理定位**：它没有 GeoIP 数据库，也不能把用户地址
        送去第三方定位服务换取一个——那会泄漏本平面其余部分小心不去保留的数据。
        所以 country / region / city / asn / isp 由管理员带外提供并原样存储。

        服务端自己从请求来源得到的是出口地址与由它推导的网段；
        country 一类的行政区划信息**不会**由地址推算出来，只能管理员填。
        传空字符串表示清除该字段。
      operationId: adminSetDeviceGeo
      security:
        - AdminBearerAuth: []
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceGeo"
      responses:
        "200":
          description: 已写入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceActivity"
        "400":
          description: 字段不在粗略集合内（BadRequest）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 设备不存在（NotFound）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
