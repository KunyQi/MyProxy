openapi: 3.0.3
info:
  title: MyProxy Server API
  version: 0.1.0
  description: |
    MyProxy 控制面 API。Windows、Android 与 Linux 使用同一配对和配置协议。
    - Admin 鉴权：长期 Admin Token 或网页临时会话 Bearer；ui-ticket 只接受长期 Token。
    - Device 鉴权：Authorization: Bearer <deviceToken>。
    - 统一错误体：{"error":{"code":"...","message":"..."}}。
    - 公网仅开放 health、connectivity-check、六条 Device API 与三端 latest 精确路由。
    - Admin API、管理网页及 readyz 仅通过私有后端访问。
    - deployment.json 配置 HTTPS 源站，客户端使用标准 CA 链、有效期及主机名验证。
servers:
  - url: https://api.example.invalid
    description: 公开 Device API 示例源站（部署前替换）
  - url: https://127.0.0.1:1820
    description: 私有完整控制面（仅本机或 SSH 隧道）
  - url: http://127.0.0.1:8090
    description: 本地运行 run_local.py
tags:
  - name: public
    description: 公开接口，无鉴权
  - name: device
    description: 设备客户端接口（claim 公开，config/heartbeat 需设备 Bearer）
  - name: admin
    description: 管理接口，需 Admin Bearer
paths:
  /connectivity-check:
    get:
      tags: [public]
      security: []
      summary: 隧道连通性检测
      description: 精确 GET 路径，不接受查询参数；返回空 204，不写数据库。不跟随重定向的客户端通过隧道访问此接口。
      operationId: connectivityCheck
      responses:
        '204':
          description: 检测端点可达，响应体为空。
        '404':
          description: 路径、方法或查询参数不匹配。
  /api/admin/ui-ticket:
    post:
      tags: [admin]
      security:
        - AdminBearerAuth: []
      description: Private listener. Long-lived Admin Bearer only; creates a single-use 60-second ticket.
      responses:
        '200': {description: 'JSON ticket and expiresIn (60).'}
        '401': {description: Invalid long-lived Admin Bearer.}
        '429': {description: Too many outstanding tickets.}
  /admin/session:
    post:
      tags: [admin]
      security: []
      description: Private listener only. Atomically consume a ticket; no cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: {type: string}
      responses:
        '200': {description: 'JSON token and expiresIn (3600).'}
        '401': {description: Invalid or expired or consumed ticket.}
        '429': {description: Too many active sessions.}
  /api/admin/ui-session:
    delete:
      tags: [admin]
      security:
        - AdminBearerAuth: []
      description: Revoke the calling UI session Bearer.
      responses:
        '200': {description: 'JSON ok (true).'}
        '401': {description: Invalid Bearer.}
  /healthz:
    servers:
      - url: https://{deviceApiHost}:{deviceApiPort}
        description: 生产公网 Device API 网关（精确路由白名单）
        variables:
          deviceApiHost:
            default: api.example.invalid
            description: 部署配置；必须与客户端地址及 TLS 信任模式一致。
          deviceApiPort:
            default: "443"
    get:
      tags:
        - public
      summary: 健康检查
      description: 公开健康检查，不写 DB。
      operationId: healthz
      responses:
        "200":
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: 服务内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /readyz:
    servers:
      - url: https://127.0.0.1:1820
        description: 私有回环 readiness（公网 nginx 不代理）
    get:
      tags:
        - public
      summary: 数据库与 x-ui readiness
      description: |
        仅用于私有运维检查。db/xui 任一检查失败返回 503；响应不泄露路径、SQL、profile
        或错误详情。所有响应带安全的 X-Request-ID，可用于关联结构化日志。
      operationId: readyz
      responses:
        "200":
          description: 数据库与 x-ui 均可读
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: 数据库或 x-ui 不可读
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /api/device/claim:
    servers:
      - url: https://{deviceApiHost}:{deviceApiPort}
        description: 生产公网 Device API 网关（精确路由白名单）
        variables:
          deviceApiHost:
            default: api.example.invalid
          deviceApiPort:
            default: "443"
    post:
      tags:
        - device
      summary: 配对码换取设备身份与首份配置
      description: |
        无鉴权。输入配对码，服务端校验并返回设备身份、设备 Token 与首份 ServerProfile。
        客户端只输入配对码：Device API 地址由 deployment.json 在构建时提供，
        HTTPS 使用系统信任的证书链、有效期与主机名校验，
        用户不选服务器。返回的 config.server 是 Xray 数据面地址，不是 Device API 地址。
        pairingCode 规范化：去首尾空白 -> 去 - 和空格 -> uppercase -> 每 4 位插回 -。
        clientInstanceId 可选；新客户端应持久化 UUID v4。同一配对码、同一安装标识在
        10 分钟窗口内可重试并得到相同 deviceId/deviceToken；不同标识或超窗返回 PairingInvalid。
      operationId: claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequest"
      responses:
        "200":
          description: 绑定成功，返回设备身份与首份配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "400":
          description: 参数或业务错误（BadRequest / PairingInvalid / PairingExpired）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: 请求过于频繁（RateLimited）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 服务器内部错误（ServerError）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/device/config:
    servers:
      - url: https://{deviceApiHost}:{deviceApiPort}
        description: 生产公网 Device API 网关（精确路由白名单）
        variables:
          deviceApiHost:
            default: api.example.invalid
          deviceApiPort:
            default: "443"
    get:
      tags:
        - device
      summary: 获取最新配置
      description: |
        设备 Bearer 鉴权。返回最新 configVersion 与 ServerProfile。
        设备 status 必须为 active；同时更新 last_seen_at。
      operationId: getDeviceConfig
      security:
        - DeviceBearerAuth: []
      responses:
        "200":
          description: 最新配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfigResponse"
        "401":
          description: 设备已失效（TokenInvalid / DeviceNotFound）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 服务器内部错误（ServerError）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/device/heartbeat:
    servers:
      - url: https://{deviceApiHost}:{deviceApiPort}
        description: 生产公网 Device API 网关（精确路由白名单）
        variables:
          deviceApiHost:
            default: api.example.invalid
          deviceApiPort:
            default: "443"
    post:
      tags:
        - device
      summary: 设备心跳
      description: |
        设备 Bearer 鉴权。请求体允许为空对象或 {}。服务端更新 last_seen_at，
        记录本次请求的出口地址（完整地址入库，只经 Admin API 出站），并顺带触发一次
        受节流的 x-ui 计数器扫描（失败被吞掉，不影响心跳）。响应带回当前 configVersion、
        本设备解析出的 release 身份与 featureFlags。
      operationId: heartbeat
      security:
        - DeviceBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: 可为空对象 {}
              additionalProperties: true
      responses:
        "200":
          description: 心跳成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"
        "401":
          description: 设备已失效（TokenInvalid / DeviceNotFound）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 服务器内部错误（ServerError）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/device/update:
    servers:
      - url: https://{deviceApiHost}:{deviceApiPort}
        description: 生产公网 Device API 网关（精确路由白名单）
        variables:
          deviceApiHost:
            default: api.example.invalid
          deviceApiPort:
            default: "443"
    get:
      tags:
        - device
      summary: 查询本设备被指派的 release
      description: |
        Update Plane。设备 Bearer 鉴权。返回本设备当前生效的 release 及其
        **已签名 manifest 原始字节**（base64），以及生效的 feature flags。

        解析顺序为 device → user → platform，先命中者生效，且命中的 release
        必须处于 published 状态；revoked 的 release 会继续向下一层回落，
        因此「撤销一个坏版本」即是一次全量回滚。

        服务端只做搬运：manifest 的签名由客户端用内置的 Ed25519 公钥验证，
        签名覆盖 `myproxy-release-manifest-v1\0` + manifest 原始字节。
        客户端必须**先验签再解析**，且不得重新序列化 manifest。
      operationId: deviceUpdate
      security:
        - DeviceBearerAuth: []
      responses:
        "200":
          description: 查询成功（update 为 null 表示当前没有指派）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceUpdateResponse"
        "401":
          description: 设备已失效（TokenInvalid / DeviceNotFound）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 服务器内部错误（ServerError）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/device/update/report:
    servers:
      - url: https://{deviceApiHost}:{deviceApiPort}
        description: 生产公网 Device API 网关（精确路由白名单）
        variables:
          deviceApiHost:
            default: api.example.invalid
          deviceApiPort:
            default: "443"
    post:
      tags:
        - device
      summary: 回报安装结果
      description: |
        设备 Bearer 鉴权。安装成功 / 失败 / 已回滚后回报，供管理员发现
        「某个 release 在现场大面积失败」并撤销它。

        本接口**只写审计**：status=installed 时会同步 devices.client_version，
        但任何回报都不会改变该设备被指派的 release —— 否则设备可以凭回报
        把自己说到另一个版本上。回滚动作本身由客户端本地完成。
      operationId: deviceUpdateReport
      security:
        - DeviceBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportRequest"
      responses:
        "200":
          description: 已记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: 参数非法（BadRequest）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 设备已失效（TokenInvalid / DeviceNotFound）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: releaseId 不存在（NotFound）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/device/usage:
    servers:
      - url: https://{deviceApiHost}:{deviceApiPort}
        description: 生产公网 Device API 网关（精确路由白名单）
        variables:
          deviceApiHost:
            default: api.example.invalid
          deviceApiPort:
            default: "443"
    post:
      tags:
        - device
      summary: 回报聚合用量
      description: |
        Observability Plane 的设备侧入口。设备 Bearer 鉴权。

        **只接受服务类别的聚合字节数，且类别取自封闭词表**（video / social / messaging /
        web / download / other）。请求模型不接受域名、URL 或单条连接记录。
        词表外的类别返回校验错误，避免将客户端与服务端的类别版本差异静默
        合并到 other，影响聚合统计的可解释性。

        设备**不能回填历史**：只允许当前小时或上一个小时（跨小时边界的请求），
        否则单台设备就能重写某人一整个月的使用趋势。

        本接口**无法改变「用了多少」**：总量来自服务端对 x-ui 累计计数器的扫描，
        那是对数据面的测量。客户端只能说自己搬的是什么类型的流量，不能说搬了多少。
      operationId: deviceReportUsage
      security:
        - DeviceBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageReportRequest"
      responses:
        "200":
          description: 已记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: 参数非法或类别不在词表内（BadRequest）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 设备已失效（TokenInvalid / DeviceNotFound）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client/windows/latest.json:
    servers:
      - url: https://{deviceApiHost}:{deviceApiPort}
        description: 生产公网 Device API 网关（精确路由白名单）
        variables:
          deviceApiHost:
            default: api.example.invalid
          deviceApiPort:
            default: "443"
    get:
      tags:
        - public
      summary: Windows 客户端更新检查
      description: |
        公开接口，无鉴权。值来自 server_meta 表；缺省为
        {"version":"0.1.0","downloadUrl":"","sha256":"","mandatory":false}。
      operationId: getWindowsLatest
      responses:
        "200":
          description: 最新版本信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestResponse"
        "500":
          description: 服务器内部错误（ServerError）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client/android/latest.json:
    servers:
      - url: https://{deviceApiHost}:{deviceApiPort}
        description: 生产公网 Device API 网关（精确路由白名单）
        variables:
          deviceApiHost:
            default: api.example.invalid
          deviceApiPort:
            default: "443"
    get:
      tags:
        - public
      summary: Android 客户端更新检查
      description: |
        公开接口，无鉴权。使用独立于 Windows 的 server_meta 键；响应形状相同。
      operationId: getAndroidLatest
      responses:
        "200":
          description: 最新版本信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestResponse"
        "500":
          description: 服务器内部错误（ServerError）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client/linux/latest.json:
    servers:
      - url: https://{deviceApiHost}:{deviceApiPort}
        description: 生产公网 Device API 网关（精确路由白名单）
        variables:
          deviceApiHost:
            default: api.example.invalid
          deviceApiPort:
            default: "443"
    get:
      tags:
        - public
      summary: Linux 客户端更新检查
      description: |
        公开接口，无鉴权。使用独立于 Windows / Android 的 server_meta 键；响应形状相同。
        Linux claim / release / assignment 使用独立 platform=linux。
        Linux 的产物签名类型是 `ed25519`（对产物字节的分离签名），与另外两端的
        Authenticode / apksigner 并列，见 `release.PLATFORM_SIGNATURE_TYPES`。
      operationId: getLinuxLatest
      responses:
        "200":
          description: 最新版本信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestResponse"
        "500":
          description: 服务器内部错误（ServerError）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/user:
    get:
      tags:
        - admin
      summary: 用户列表
      description: 返回用户列表，deleted 用户不出现在列表；支持 ?username=<精确值> 过滤。
      operationId: adminListUsers
      security:
        - AdminBearerAuth: []
      parameters:
        - name: username
          in: query
          required: false
          description: 用户名精确过滤
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          description: 管理员校验失败（AdminUnauthorized）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 服务器内部错误（ServerError）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - admin
      summary: 创建用户
      description: |
        username 必填，trim 后非空且 <=64；displayName 可缺省（默认等于 username）。
        重复 username 返回 409 Conflict。
      operationId: adminCreateUser
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: 请求参数错误（BadRequest）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 管理员校验失败（AdminUnauthorized）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 用户名冲突（Conflict）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 服务器内部错误（ServerError）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/user/{id}:
    delete:
      tags:
        - admin
      summary: 删除用户（软删除）
      description: |
        status=deleted；若存在未使用 active binding link，同步置 revoked。
        不存在返回 404 NotFound。
      operationId: adminDeleteUser
      security:
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 用户 ID（usr_...）
          schema:
            type: string
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: 管理员校验失败（AdminUnauthorized）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 资源不存在（NotFound）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 服务器内部错误（ServerError）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/binding:
    get:
      tags:
        - admin
      summary: 绑定码列表
      description: |
        返回绑定码列表；支持 ?userId=<id> 过滤。读取时会把已自然到期的 active
        记录更新为 expired，因此 status 是请求时刻的实时状态。明文 code 仅在创建
        响应中出现一次，列表不返回 code。
      operationId: adminListBindings
      security:
        - AdminBearerAuth: []
      parameters:
        - name: userId
          in: query
          required: false
          description: 按用户 ID 过滤
          schema:
            type: string
      responses:
        "200":
          description: 绑定码列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingListResponse"
        "401":
          description: 管理员校验失败（AdminUnauthorized）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 服务器内部错误（ServerError）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - admin
      summary: 创建绑定码
      description: |
        userId 必须 active；expiresInSeconds 缺省 3600，范围 60-604800。
        code 由 secrets.token_hex(4) 大写按 4 位分组生成（如 A7K9-M2QF）。
        明文 code 仅在本次成功响应中返回，后续列表和延期响应不会再次返回。
      operationId: adminCreateBinding
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindingCreateRequest"
      responses:
        "200":
