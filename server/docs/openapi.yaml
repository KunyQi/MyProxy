      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LatestSetRequest"
      responses:
        "200":
          description: 设置后的 Android latest 对象
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestResponse"
        "400":
          description: 请求参数错误（BadRequest）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 管理员校验失败（AdminUnauthorized）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 服务器内部错误（ServerError）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/latest/linux:
    get:
      tags:
        - admin
      summary: 获取当前 Linux 客户端最新版本信息
      operationId: adminGetLinuxLatest
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          description: 当前 Linux latest 对象
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestResponse"
        "401":
          description: 管理员校验失败（AdminUnauthorized）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 服务器内部错误（ServerError）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - admin
      summary: 设置 Linux 客户端最新版本信息
      operationId: adminSetLinuxLatest
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LatestSetRequest"
      responses:
        "200":
          description: 设置后的 Linux latest 对象
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestResponse"
        "400":
          description: 请求参数错误（BadRequest）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 管理员校验失败（AdminUnauthorized）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 服务器内部错误（ServerError）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  headers:
    RequestId:
      description: 请求关联 ID；公网 nginx 覆盖客户端提供值，私有入口接受合法值或生成新值。
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$"
  securitySchemes:
    AdminBearerAuth:
      type: http
      scheme: bearer
      description: |
        管理接口鉴权：Authorization: Bearer <MYPROXY_ADMIN_TOKEN>。
        Token 来自 /etc/myproxy-api/admin.env。
    DeviceBearerAuth:
      type: http
      scheme: bearer
      description: |
        设备鉴权：Authorization: Bearer <deviceToken>。
        服务端只存 SHA-256 哈希，不存明文；设备 token 仅在 claim 成功或该 claim
        的有界幂等重放响应中出现。
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: |
            安全文案错误码：PairingInvalid / PairingExpired / TokenInvalid /
            DeviceNotFound / AdminUnauthorized / RateLimited / BadRequest /
            NotFound / Conflict / ManifestRejected / ServerError。
            ManifestRejected 只出现在 Admin 登记 release 时，文案刻意不说是哪一项
            校验失败；调用方不得匹配文案。
          enum:
            - PairingInvalid
            - PairingExpired
            - TokenInvalid
            - DeviceNotFound
            - AdminUnauthorized
            - RateLimited
            - BadRequest
            - NotFound
            - Conflict
            - ManifestRejected
            - ServerError
        message:
          type: string
          description: 与 code 对应的安全文案。
    HealthResponse:
      type: object
      required:
        - ok
        - service
        - version
      properties:
        ok:
          type: boolean
        service:
          type: string
          example: myproxy-api
        version:
          type: string
          example: "0.1.0"
    ReadyResponse:
      type: object
      required:
        - ok
        - service
        - version
        - checks
      properties:
        ok:
          type: boolean
        service:
          type: string
          example: myproxy-api
        version:
          type: string
          example: "0.1.0"
        checks:
          type: object
          required:
            - db
            - xui
          additionalProperties: false
          properties:
            db:
              type: boolean
            xui:
              type: boolean
    ClaimRequest:
      type: object
      required:
        - pairingCode
        - deviceName
        - platform
        - clientVersion
      properties:
        pairingCode:
          type: string
          maxLength: 32
          description: 形如 A7K9-M2QF；服务端会规范化。
        deviceName:
          type: string
          maxLength: 128
          description: 超过 128 字符服务端截断。
        platform:
          type: string
          maxLength: 32
          example: windows
        clientVersion:
          type: string
          maxLength: 32
          example: "0.1.0"
        clientInstanceId:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[A-Za-z0-9._~-]{16,128}$'
          example: b8650c02-f6d3-4f4b-b823-4920217bf355
          description: |
            可选的安装级稳定高熵标识（推荐 UUID v4）。服务端只保存域分隔后的
            SHA-256 哈希；同一 claim 的安全重试必须发送完全相同的值。
    ServerProfile:
      type: object
      description: |
        下发给客户端的配置对象。公共字段（除 uuid）来自
        XuiAdapter.public_profile()；uuid 为设备专属 xray client UUID。
      required:
        - server
        - port
        - uuid
        - security
        - publicKey
        - shortId
        - sni
        - fingerprint
        - flow
        - spiderX
      properties:
        server:
          type: string
          description: 公网服务器地址。
          example: 203.0.113.10
        port:
          type: integer
          minimum: 1
          maximum: 65535
          example: 443
        uuid:
          type: string
          description: 设备专属 xray client UUID；admin 查询最新配置时可能为公共模板（uuid 为空字符串）。
        security:
          type: string
          example: reality
        publicKey:
          type: string
          description: REALITY 公钥（私钥严禁下发）。
        shortId:
          type: string
          description: realitySettings.shortIds 中已启用值。
        sni:
          type: string
          example: example.com
        fingerprint:
          type: string
          example: chrome
        flow:
          type: string
          example: xtls-rprx-vision
        spiderX:
          type: string
          example: /
    ClaimResponse:
      type: object
      required:
        - deviceId
        - deviceToken
        - configVersion
        - config
      properties:
        deviceId:
          type: string
          example: dev_...
        deviceToken:
          type: string
          description: 仅在 claim 成功/有界幂等重放响应中出现；服务端只存哈希。
          example: tok_...
        configVersion:
          type: integer
          minimum: 1
          example: 1
        config:
          $ref: "#/components/schemas/ServerProfile"
    DeviceConfigResponse:
      type: object
      required:
        - configVersion
        - config
      properties:
        configVersion:
          type: integer
          minimum: 1
          example: 1
        config:
          $ref: "#/components/schemas/ServerProfile"
    DeviceUpdateResponse:
      type: object
      required:
        - update
        - featureFlags
        - serverTime
      properties:
        update:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AssignedRelease"
        featureFlags:
          $ref: "#/components/schemas/FeatureFlags"
        serverTime:
          type: string
          example: "2026-09-19T01:00:00Z"
    AssignedRelease:
      type: object
      required:
        - releaseId
        - version
        - channel
        - mandatory
        - source
        - manifest
        - signature
        - signingKeyId
      properties:
        releaseId:
          type: string
          example: rel_9f0c1d2e3a4b5c6d7e8f9a0b
        version:
          type: string
          example: 1.2.3
        channel:
          type: string
          enum: [stable, beta]
        mandatory:
          type: boolean
        source:
          type: string
          enum: [device, user, platform]
          description: 命中的指派层级。
        manifest:
          type: string
          format: byte
          description: |
            manifest 的**原始 UTF-8 字节**的 base64。客户端必须按收到的字节验签，
            不得先解析再重新序列化：三端序列化器在键序、转义与空白上的任何差异
            都会让同一份 manifest 在一端验签通过、在另一端失败。
        signature:
          type: string
          format: byte
          description: 64 字节 Ed25519 签名的 base64，覆盖域前缀 + manifest 原始字节。
        signingKeyId:
          type: string
          example: rel-2026a
    FeatureFlags:
      type: object
      description: |
        平面化的开关表，值只允许 string / number / boolean / null，且最多 64 项。
        刻意不允许嵌套对象：嵌套正是把结构化指令夹带进「只该传开关」的通道的形状。
      additionalProperties:
        nullable: true
        oneOf:
          - type: string
            maxLength: 128
          - type: number
          - type: boolean
    UpdateReportRequest:
      type: object
      required:
        - releaseId
        - status
      properties:
        releaseId:
          type: string
        status:
          type: string
          enum: [installed, failed, rolledback]
        detail:
          type: string
          maxLength: 256
          description: 可选的失败原因，会被截断后写入审计。
    RegisterReleaseRequest:
      type: object
      required:
        - manifest
        - signature
        - signingKeyId
      properties:
        manifest:
          type: string
          format: byte
          description: manifest 原始字节的 base64，最大 8192 字节。
        signature:
          type: string
          format: byte
        signingKeyId:
          type: string
        note:
          type: string
          maxLength: 256
    Release:
      type: object
      required:
        - id
        - platform
        - version
        - channel
        - status
        - mandatory
        - artifactUrl
        - artifactSha256
      properties:
        id:
          type: string
        platform:
          type: string
          enum: [windows, android, linux]
        version:
          type: string
        channel:
          type: string
          enum: [stable, beta]
        status:
          type: string
          enum: [draft, published, revoked]
        mandatory:
          type: boolean
        artifactUrl:
          type: string
          format: uri
        artifactSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        artifactSize:
          type: integer
        platformSignatureType:
          type: string
          enum: [authenticode, apksigner, ed25519]
        platformSignatureSubjectSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Windows/Android 为平台签名证书 SHA-256；Linux 为内置产物公钥 SHA-256。
        minimumVersion:
          type: string
        signingKeyId:
          type: string
        note:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
    SetAssignmentRequest:
      type: object
      required:
        - scope
        - platform
      properties:
        scope:
          type: string
          enum: [device, user, platform]
        targetId:
          type: string
          description: scope=platform 时忽略。
        platform:
          type: string
          enum: [windows, android, linux]
        releaseId:
          type: string
          description: 省略则该指派只携带 feature flags。
        featureFlags:
          $ref: "#/components/schemas/FeatureFlags"
        note:
          type: string
          maxLength: 256
    Assignment:
      type: object
      required:
        - id
        - scope
        - targetId
        - platform
        - releaseId
      properties:
        id:
          type: string
        scope:
          type: string
          enum: [device, user, platform]
        targetId:
          type: string
        platform:
          type: string
          enum: [windows, android, linux]
        releaseId:
          type: string
        featureFlags:
          type: string
          description: 以 JSON 字符串原样返回，便于与审计流水逐字节比对。
        note:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
    EffectiveRelease:
      type: object
      required:
        - deviceId
        - platform
        - release
        - source
        - featureFlags
      properties:
        deviceId:
          type: string
        platform:
          type: string
        installedVersion:
          type: string
          description: 设备最近一次回报 installed 的版本。
        release:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Release"
        source:
          type: string
          enum: ["", device, user, platform]
        featureFlags:
          $ref: "#/components/schemas/FeatureFlags"
    ReleaseAuditEntry:
      type: object
      required:
        - at
        - action
      properties:
        at:
          type: string
        action:
          type: string
          example: assignment_set
        scope:
          type: string
        targetId:
          type: string
        platform:
          type: string
        releaseId:
          type: string
        previousReleaseId:
          type: string
        detail:
          type: string
    UsageReportRequest:
      type: object
      properties:
        bucketStart:
          type: string
          description: 可省略，默认当前小时；只接受当前或上一个小时。
        categories:
          $ref: "#/components/schemas/ServiceCategories"
    ServiceCategories:
      type: object
      description: |
        封闭词表，键只能是 video / social / messaging / web / download / other，
        值为该桶内的字节数。词表外的键一律拒绝。
      additionalProperties: false
      properties:
        video:
          type: integer
          minimum: 0
        social:
          type: integer
          minimum: 0
        messaging:
          type: integer
          minimum: 0
        web:
          type: integer
          minimum: 0
        download:
          type: integer
          minimum: 0
        other:
          type: integer
          minimum: 0
    UsageResponse:
      type: object
      required:
        - granularity
        - rangeStart
        - rangeEnd
        - series
        - categories
        - totals
      properties:
        deviceId:
          type: string
        userId:
          type: string
        granularity:
          type: string
          enum: [hour, day]
        rangeStart:
          type: string
        rangeEnd:
          type: string
        retentionDays:
          type: integer
          description: 小时桶的保留天数，超期在写入时裁剪（本进程没有调度器）。
        series:
          type: array
          items:
            $ref: "#/components/schemas/UsageBucket"
        categories:
          type: array
          items:
            type: object
            required: [category, totalBytes]
            properties:
              category:
                type: string
                enum: [video, social, messaging, web, download, other]
              totalBytes:
                type: integer
        totals:
          type: object
          properties:
            uplinkBytes:
              type: integer
            downlinkBytes:
              type: integer
            totalBytes:
              type: integer
    UsageBucket:
      type: object
      required:
        - bucketStart
        - uplinkBytes
        - downlinkBytes
        - totalBytes
      properties:
        bucketStart:
          type: string
        uplinkBytes:
          type: integer
        downlinkBytes:
          type: integer
        totalBytes:
          type: integer
    DeviceActivity:
      type: object
      required:
        - deviceId
        - state
        - location
      properties:
        deviceId:
          type: string
        userId:
          type: string
        deviceName:
          type: string
        platform:
          type: string
        status:
          type: string
        lastSeenAt:
          type: string
          nullable: true
        state:
          type: string
          enum: [connected, idle, offline]
          description: |
            由 lastSeenAt 推导而非存储：断电消失的设备没机会告诉任何人它走了，
            存一个标志位会让它永远宣称自己在线。
        location:
          $ref: "#/components/schemas/CoarseLocation"
        recentAddresses:
          type: array
          description: |
            该设备最近使用过的若干个**不同**出口地址，按末见时间倒序。
            只出现在单设备详情里：列表视图要为此对每台设备多查一次，
            而「这个账号是不是在到处跑」是针对某一台设备问的问题。
          items:
            $ref: "#/components/schemas/DeviceAddress"
        addressHistoryLimit:
          type: integer
          description: 每台设备最多保留的不同地址数（MYPROXY_DEVICE_ADDRESS_HISTORY）。
          example: 10
    DeviceAddress:
      type: object
      properties:
        address:
          type: string
          example: 203.0.113.47
        firstSeenAt:
          type: string
        lastSeenAt:
          type: string
    CoarseLocation:
      type: object
      properties:
        ipAddress:
          type: string
          description: |
            设备当前的完整出口地址，服务端所见。请求未经受信反代转发时为空串
            （此时不会覆盖已存地址）。**仅 Admin API 返回**——Device API 既不
            接受也不回读地址。一份 Control Plane 数据库的副本因此**就是**
            一份「谁从哪里连过」的记录，按敏感数据对待。
          example: 203.0.113.47
        ipPrefix:
          type: string
          description: |
            由 ipAddress 推导的网段（IPv4 /24、IPv6 /48），供粗略位置视图分组。
            它不再是隐私措施——完整地址就存在旁边。
          example: 203.0.113.0/24
        country:
          type: string
        region:
          type: string
        city:
          type: string
        asn:
          type: string
        isp:
          type: string
    DeviceGeo:
      type: object
      description: 管理员带外提供的粗略位置；传空字符串表示清除。
      additionalProperties: false
      properties:
        country:
          type: string
          maxLength: 64
        region:
          type: string
          maxLength: 64
        city:
          type: string
          maxLength: 64
        asn:
          type: string
          maxLength: 64
        isp:
          type: string
          maxLength: 64
    HeartbeatResponse:
      type: object
      required:
        - ok
        - configVersion
        - serverTime
      properties:
        ok:
          type: boolean
        configVersion:
          type: integer
          minimum: 1
          example: 1
        serverTime:
          type: string
          description: UTC 秒级时间，格式 YYYY-MM-DDTHH:MM:SSZ。
          example: "2026-08-16T01:00:00Z"
        release:
          nullable: true
          description: |
            本设备当前生效的 release 标识。每次心跳都重算，因此指派变更最多在
            一个心跳周期内到达在线客户端，无需客户端再轮询第二个接口。
            这里**只有身份**，已签名的 manifest 仍须从 /api/device/update 取并验签。
          allOf:
            - $ref: "#/components/schemas/HeartbeatRelease"
        featureFlags:
          $ref: "#/components/schemas/FeatureFlags"
    HeartbeatRelease:
      type: object
      required:
        - releaseId
        - version
        - channel
        - mandatory
        - source
      properties:
        releaseId:
          type: string
        version:
          type: string
        channel:
          type: string
          enum: [stable, beta]
        mandatory:
          type: boolean
        source:
          type: string
          enum: [device, user, platform]
    LatestResponse:
      type: object
      description: |
        当存在 platform 层指派且该 release 已发布时，本响应额外带上 releaseId、
        manifest、signature、signingKeyId，并以该 release 的值覆盖 version /
        downloadUrl / sha256 / mandatory，确保旧客户端读取的这四个字段与
        签名清单一致。

        本路由不需要设备令牌，这是「更新检查不能完全依赖 Control Plane 在线」的
        落点：拿不到令牌的客户端仍能取到并验证一份签名 manifest。
        **按设备的指派永远不会出现在这里** —— 那等于把某台设备的指派泄漏给任何人。
      required:
        - version
        - downloadUrl
        - sha256
        - mandatory
      properties:
        releaseId:
          type: string
          description: 仅当存在已发布的 platform 层指派时出现。
        manifest:
          type: string
          format: byte
          description: 仅当存在已发布的 platform 层指派时出现。
        signature:
          type: string
          format: byte
        signingKeyId:
          type: string
        version:
          type: string
          # 与 release.py 的 _VERSION_RE 一致：有 platform 层指派时取自该 release，
          # 可以带预发布 / 构建后缀；旧形状仍是 x.y.z。
          pattern: '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$'
          example: "0.1.0"
        downloadUrl:
          type: string
        sha256:
          type: string
          pattern: '^(?:[0-9a-f]{64})?$'
          description: 64 位小写十六进制；V1 可为空字符串。
        mandatory:
          type: boolean
    UserCreateRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          maxLength: 64
          description: 必填，trim 后非空且 <=64。
        displayName:
          type: string
          maxLength: 64
          description: 可缺省，默认等于 username。
    UserResponse:
      type: object
      required:
        - id
        - username
        - displayName
        - status
        - createdAt
      properties:
        id:
          type: string
          example: usr_...
        username:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum:
            - active
            - deleted
        createdAt:
          type: string
          example: "2026-08-16T01:00:00Z"
    UserListResponse:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
    BindingCreateRequest:
      type: object
      required:
        - userId
        - deviceTemplate
      properties:
        userId:
          type: string
          description: 必须 active 用户。
          example: usr_...
        deviceTemplate:
          type: string
          maxLength: 32
          example: windows
        expiresInSeconds:
          type: integer
          minimum: 60
          maximum: 604800
          default: 3600
          example: 3600
    BindingResponse:
      type: object
      required:
        - id
        - userId
        - deviceTemplate
        - status
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          example: lnk_...
        userId:
          type: string
          example: usr_...
        deviceTemplate:
          type: string
          example: windows
        status:
          type: string
          enum:
            - active
            - claimed
            - expired
            - revoked
        expiresAt:
          type: string
          example: "2026-08-16T01:00:00Z"
        createdAt:
          type: string
          example: "2026-08-16T00:00:00Z"
    BindingCreateResponse:
      allOf:
        - $ref: "#/components/schemas/BindingResponse"
        - type: object
          required:
            - code
          properties:
            code:
              type: string
              description: 仅创建成功响应返回一次；列表与延期响应不返回。
              example: A7K9-M2QF
    BindingListResponse:
      type: object
      required:
        - bindings
      properties:
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/BindingResponse"
    BindingExtendRequest:
      type: object
      required:
        - extendsSeconds
      properties:
        extendsSeconds:
          type: integer
          minimum: 1
          example: 3600
    DeviceResponse:
      type: object
      required:
        - id
        - userId
        - deviceName
        - platform
        - clientVersion
        - status
        - createdAt
        - updatedAt
        - xrayClientEmail
      properties:
        id:
          type: string
          example: dev_...
        userId:
          type: string
          example: usr_...
        deviceName:
          type: string
        platform:
          type: string
        clientVersion:
          type: string
        status:
          type: string
          enum:
            - active
            - disabled
        lastSeenAt:
          type: string
          nullable: true
          example: "2026-08-16T01:00:00Z"
        createdAt:
          type: string
          example: "2026-08-16T00:00:00Z"
        updatedAt:
          type: string
          example: "2026-08-16T00:00:00Z"
        xrayClientEmail:
          type: string
          description: 不返回 token 任何形式。
    DeviceListResponse:
      type: object
      required:
        - devices
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceResponse"
    AdminConfigResponse:
      type: object
      required:
        - configVersion
        - config
        - createdAt
      properties:
        configVersion:
          type: integer
          minimum: 1
          example: 1
        config:
          $ref: "#/components/schemas/ServerProfile"
        createdAt:
          type: string
          example: "2026-08-16T00:00:00Z"
    ConfigVersionCreateRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 256
          example: rotate
    LatestSetRequest:
      type: object
      required:
        - version
        - downloadUrl
        - sha256
        - mandatory
      properties:
        version:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
          example: "0.2.0"
        downloadUrl:
          type: string
        sha256:
          type: string
          pattern: '^(?:[0-9a-f]{64})?$'
          description: 非空时必须为 64 位小写十六进制；V1 可为空字符串。
        mandatory:
          type: boolean
    OkResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          example: true
