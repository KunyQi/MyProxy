  /api/admin/usage:
    get:
      tags:
        - admin
      summary: 查询聚合用量与时间趋势
      description: |
        按设备或用户查询。`granularity` 为 `hour`（默认，窗口默认最近 24 小时）
        或 `day`（默认最近 30 天）。只存小时桶，日粒度由小时桶求和得到。

        **空桶会照常返回**：把没有流量的桶悄悄丢掉，会让「那时没用」和
        「那时没有数据」读起来一模一样，而这是两个不同的答案。

        调用会顺带触发一次受节流的 x-ui 计数器扫描，因此返回的数字是新鲜的。
      operationId: adminUsage
      security:
        - AdminBearerAuth: []
      parameters:
        - in: query
          name: deviceId
          schema:
            type: string
        - in: query
          name: userId
          schema:
            type: string
        - in: query
          name: start
          schema:
            type: string
            example: "2026-09-20T00:00:00Z"
        - in: query
          name: end
          schema:
            type: string
        - in: query
          name: granularity
          schema:
            type: string
            enum: [hour, day]
            default: hour
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "400":
          description: 时间窗非法或过宽（BadRequest）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: deviceId 不存在（NotFound）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
