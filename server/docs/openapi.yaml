  /api/admin/release:
    get:
      tags:
        - admin
      summary: 列出已登记的 release
      operationId: adminListReleases
      security:
        - AdminBearerAuth: []
      parameters:
        - in: query
          name: platform
          schema:
            type: string
            enum: [windows, android, linux]
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, published, revoked]
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                required: [releases]
                properties:
                  releases:
                    type: array
                    items:
                      $ref: "#/components/schemas/Release"
    post:
      tags:
        - admin
      summary: 登记一个已签名的 release
      description: |
        服务端**只验签不签名**：VPS 上没有私钥，签名在发布流程里离线完成。
        因此即使 Admin Token 完全泄漏，攻击者也只能登记一个已经带着可信密钥
        签名的 manifest —— 这正是「Control Plane 不具备下发任意可执行文件」
        这条验收标准成立的原因。

        未配置 `MYPROXY_RELEASE_SIGNING_KEYS` 时本接口一律拒绝（fail closed）。
        同一 (platform, version) 不可重复登记：同一版本号指向不同字节是客户端
        唯一无法察觉的攻击面。失败一律返回通用的 ManifestRejected，调用方
        **不得匹配错误消息**。
      operationId: adminRegisterRelease
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterReleaseRequest"
      responses:
        "200":
          description: 登记成功（状态为 draft）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "400":
          description: manifest 被拒绝（ManifestRejected / BadRequest）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 该 platform+version 已登记（Conflict）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/release/{releaseId}/publish:
    post:
      tags:
        - admin
      summary: 发布 release
      description: 只有 published 的 release 才能被指派与下发。
      operationId: adminPublishRelease
      security:
