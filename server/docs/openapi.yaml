        - in: query
          name: platform
          schema:
            type: string
            enum: [windows, android, linux]
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Assignment"
    post:
      tags:
        - admin
      summary: 指派 release / feature flags
      description: |
        按 device / user / platform 三种 scope 指派。指派只表达
        `Device A → Release X`，**不能携带 URL、脚本或命令**。

        releaseId 省略时该条指派只携带 feature flags，不改变版本；
        指派的 release 必须是同平台且已 published。
      operationId: adminSetAssignment
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAssignmentRequest"
      responses:
        "200":
          description: 指派成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          description: 参数非法（BadRequest）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 目标或 release 不存在（NotFound）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: release 未发布（Conflict）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
