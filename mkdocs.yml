# MyProxy documentation site (Chinese), published to GitHub Pages by
# .github/workflows/pages.yml. mkdocs.en.yml inherits this file and builds the
# English site under /en/ from the *.en.md translations.
#
# docs/ holds the site's own pages; scripts/mkdocs_hooks.py adds the README,
# policy files and component READMEs and rewrites their links.
#
# Local preview:
#   python -m pip install --require-hashes -r scripts/docs-requirements.txt
#   python -m mkdocs serve                      # Chinese
#   python -m mkdocs serve -f mkdocs.en.yml     # English

site_name: MyProxy
site_description: >-
  自建 VPN：Windows / Android / Linux 三端客户端，配对码登录，一键开关。
  Self-hosted VPN with one-switch clients, Xray VLESS + REALITY, managed through 3x-ui.
site_url: https://kunyqi.github.io/MyProxy/
repo_url: https://github.com/KunyQi/MyProxy
repo_name: KunyQi/MyProxy
edit_uri: edit/main/docs/
copyright: MyProxy · MIT License

docs_dir: docs
site_dir: site
strict: true
# English translations are built by mkdocs.en.yml.
exclude_docs: |
  *.en.md

hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  language: zh
  # partials/alternate.html: one-click switch to the same page in the other language.
  custom_dir: docs-theme
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  # The client's three skins (windows/MyProxy/Themes), all light like the
  # client itself. Colours come from extra_css; see docs/assets/stylesheets/myproxy.css.
  palette:
    - scheme: classic
      primary: custom
      accent: custom
      toggle:
        icon: material/palette-outline
        name: 经典 · 切换到瓷白
    - scheme: porcelain
      primary: custom
      accent: custom
      toggle:
        icon: material/palette-outline
        name: 瓷白 · 切换到釉陶
    - scheme: ceramic
      primary: custom
      accent: custom
      toggle:
        icon: material/palette-outline
        name: 釉陶 · 切换到经典
  # System fonts only (the client's Segoe UI + Microsoft YaHei UI first);
  # no Google Fonts request, which is slow or blocked in mainland China.
  font: false
  logo: assets/images/app.svg
  favicon: assets/images/app.svg
  icon:
    repo: fontawesome/brands/github

# Both languages; links are site-root paths shared by both builds.
extra:
  alternate:
    - name: 中文
      link: /MyProxy/
      lang: zh
      title: 切换到中文
    - name: English
      link: /MyProxy/en/
      lang: en
      title: Read this page in English

# tokens.css is generated from the client's XAML design tokens by the hook.
extra_css:
  - assets/stylesheets/tokens.css
  - assets/stylesheets/myproxy.css

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-style heading anchors, so links such as
      # README.md#开源项目参考清单--references resolve on the site too.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  links:
    anchors: warn

# Guides (docs/index.md, docs/guide/) are written for the site; the sections
# after them are the repository's technical docs, published unchanged.
nav:
  - 首页: index.md
  - 入门:
      - guide/how-it-works.md
      - guide/deploy.md
      - guide/clients.md
      - guide/faq.md
  - 参考 · 部署与运维:
      - deployment.md
      - network-routing.md
      - server/index.md
      - server/deployment.md
      - server/admin-browser-bridge.md
  - 参考 · 客户端:
      - linux/index.md
      - linux/gui.md
      - android-core-rebuild.md
  - 参考 · 开发与发布:
      - architecture.md
      - maintaining.md
      - release-publishing.md
      - contributing.md
  - 参考 · 许可与政策:
      - 项目 README: readme.md
      - third-party.md
      - third-party-notices.md
      - security.md
      - changelog.md
