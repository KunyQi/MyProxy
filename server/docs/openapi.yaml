    post:
      tags:
        - admin
      summary: 强制刷新 x-ui 计数器
      description: 绕过节流立即扫描一次。本进程没有调度器，扫描平时由心跳与查询顺带触发。
      operationId: adminRefreshUsage
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          description: 刷新完成
          content:
            application/json:
              schema:
                type: object
                required: [ok, devicesUpdated, serverTime]
                properties:
                  ok:
                    type: boolean
                  devicesUpdated:
                    type: integer
                  serverTime:
                    type: string
