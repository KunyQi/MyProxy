              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 已撤销的 release 不能重新发布（Conflict）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/release/{releaseId}/revoke:
    post:
      tags:
        - admin
      summary: 撤销 release
      description: |
        撤销后所有指向它的指派会向下一层回落，因此这是一次性的全量回滚开关。
      operationId: adminRevokeRelease
      security:
        - AdminBearerAuth: []
      parameters:
        - in: path
          name: releaseId
          required: true
          schema:
            type: string
      responses:
