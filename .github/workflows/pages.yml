name: Documentation site

# Builds the MkDocs site in Chinese (mkdocs.yml, site root) and English
# (mkdocs.en.yml, /en/). Its look comes from the client's XAML design tokens,
# hence the windows/ paths below. Pull requests only build it (so
# a broken link fails review); pushes to main also publish it to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - SECURITY.md
      - THIRD_PARTY_NOTICES.md
      - docs/**
      - server/README.md
      - server/docs/**
      - linux/MyProxyLinux/README.md
      - linux/MyProxyLinux/gui/README.md
      - windows/MyProxy/Themes/*.xaml
      - windows/MyProxy/Assets/app.svg
      - '**.en.md'
      - mkdocs.en.yml
      - docs-theme/**
      - mkdocs.yml
      - scripts/mkdocs_hooks.py
      - scripts/docs-requirements.txt
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - SECURITY.md
      - THIRD_PARTY_NOTICES.md
      - docs/**
      - server/README.md
      - server/docs/**
      - linux/MyProxyLinux/README.md
      - linux/MyProxyLinux/gui/README.md
      - windows/MyProxy/Themes/*.xaml
      - windows/MyProxy/Assets/app.svg
      - '**.en.md'
      - mkdocs.en.yml
      - docs-theme/**
      - mkdocs.yml
      - scripts/mkdocs_hooks.py
      - scripts/docs-requirements.txt
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NO_MKDOCS_2_WARNING: '1'

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned documentation toolchain
        run: python -m pip install --require-hashes -r scripts/docs-requirements.txt

      - name: Build Chinese and English sites (strict)
        run: |
          python -m mkdocs build --strict
          python -m mkdocs build --strict -f mkdocs.en.yml

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
